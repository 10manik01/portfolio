<div id="chatbot-widget" data-chat-endpoint="">
    <div id="chatbot-tooltip">Hi, Chatbot here!</div>

    <div id="chatbot-window" class="hidden">
        <div id="chatbot-header">
            <div class="chatbot-title">
                <div class="chatbot-avatar">M</div>
                <span>Manik's AI Assistant</span>
            </div>
            <button id="chatbot-close" type="button">&times;</button>
        </div>

        <div id="chatbot-messages"></div>

        <div id="chatbot-input-area">
            <input type="text" id="chatbot-input" placeholder="Ask me anything..." />
            <button id="chatbot-send" type="button">&rarr;</button>
        </div>
    </div>

    <div id="chatbot-button"></div>
</div>

<link rel="stylesheet" href="/chat.css">
<script src="/chat.js"></script>
